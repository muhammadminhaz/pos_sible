# API + Postgres:  POSTGRES_PASSWORD=change-me ALLOWED_ORIGINS=https://pos.example.com docker compose up -d --build
# Database only, for `npm run dev`:  docker compose up -d db   then   cp .env.example .env.local
# On Coolify: use this file as a Docker Compose resource (Base Directory = api) and set the variables below there.
services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/pos_sible
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      POS_SEED_DEMO: ${POS_SEED_DEMO:-false}
      POS_ALLOW_SIGNUP: ${POS_ALLOW_SIGNUP:-false}
    ports:
      - "${API_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pos_sible
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
